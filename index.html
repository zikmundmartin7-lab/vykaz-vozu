<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Výkaz vozů</title>
  <meta name="description" content="Snímání čísel vozů a přestavovačů brzdy, výkaz vozidel" />
  <meta name="theme-color" content="#1f4e8c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <!-- Stejně jako Závady vozů: soubory aplikace se načítají s razítkem v adrese (?r=…), které se změní při
       znovunačtení po aktualizaci (reloadApp v js/ui.js). iPhone by jinak po „Aktualizovat“ spustil znovu staré
       skripty ze své paměti, dokud se aplikace úplně nezavře. Moduly mezi sebou dostanou razítko přes import map.
       Všechny části aplikace se stáhnou najednou (modulepreload), jinak by se načítaly postupně jedna po druhé. -->
  <script>
    (() => {
      let r = '';
      try {
        r = localStorage.getItem('app-reload') || String(Date.now());
        localStorage.setItem('app-reload', r);
      } catch {}
      const q = r ? `?r=${r}` : '';
      const mq = HTMLScriptElement.supports?.('importmap') ? q : ''; // starší Safari: moduly bez razítka
      const modules = ['js/app.js', 'js/version.js', 'js/model.js', 'js/db.js', 'js/ui.js', 'js/ocr.js', 'js/ort.js',
        'js/brake.js', 'js/xlsx.js', 'js/fields.js', 'js/light.js', 'js/series.js', 'js/frame.js',
        'js/views/home.js', 'js/views/report.js', 'js/views/entry.js', 'js/views/scanner.js',
        'js/views/output.js', 'js/views/data.js', 'js/views/trainer.js', 'vendor/preact-htm.js'];
      const imports = Object.fromEntries(modules.map((m) => [`./${m}`, `./${m}${mq}`]));
      document.write(`<link rel="stylesheet" href="css/app.css${q}">`
        + `<script type="importmap">${JSON.stringify({ imports })}<\/script>`
        + modules.map((m) => `<link rel="modulepreload" href="${m}${mq}">`).join('')
        + '<link rel="modulepreload" href="vendor/ort/ort.wasm.min.mjs">'
        + `<script type="module">import './js/app.js';<\/script>`);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
</body>
</html>
